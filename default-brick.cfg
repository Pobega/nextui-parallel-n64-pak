minarch_cpu_speed = Performance
minarch_sync_reference = Auto
minarch_rewind_enable = Off

parallel-n64-gfxplugin = glide64
parallel-n64-rspplugin = hle
parallel-n64-cpucore = dynamic_recompiler
parallel-n64-disable_expmem = enabled
parallel-n64-screensize = 320x240
parallel-n64-aspectratiohint = normal
parallel-n64-gfxplugin-accuracy = medium
parallel-n64-filtering = bilinear
parallel-n64-send_allist_to_hle_rsp = disabled
parallel-n64-enhanced-hle-audio = disabled
parallel-n64-pak1 = memory
parallel-n64-alt-map = disabled
parallel-n64-dpad-to-analog = both
parallel-n64-astick-deadzone = 15
parallel-n64-astick-sensitivity = 100

bind D-Pad Up = UP
bind D-Pad Down = DOWN
bind D-Pad Left = LEFT
bind D-Pad Right = RIGHT
bind Start = START
bind A Button (C-Down) = B
bind B Button (C-Left) = Y
bind C-Right = A
bind C-Up = X
bind C-Down = NONE:L3
bind C-Left = NONE:R3
bind L Shoulder = L1
bind R Shoulder = R1
bind Z Trigger = L2
bind C Buttons Mode = R2
bind Toggle D-Pad/Stick = SELECT
